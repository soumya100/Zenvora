# ==============================================================================
# Zenvora - SearXNG Custom Metasearch Engine Configuration
# ==============================================================================
# Optimized for privacy, speed, and clean JSON aggregation.
# ==============================================================================

use_default_settings: true

general:
  debug: false
  instance_name: "Zenvora Search Engine Backend"
  donation_url: false
  contact_url: false
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: "duckduckgo"
  default_lang: ""
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "zenvora_searxng_ultra_secure_internal_token_key_change_in_prod"
  base_url: false
  image_proxy: true
  method: "GET"
  http_protocol_version: "1.1"

ui:
  static_use_hash: true
  query_in_title: false
  center_alignment: true
  cache_url: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

# Enabled search engines categorized for Zenvora
engines:
  - name: google
    engine: google
    shortcut: go
    categories: [general, news]
    timeout: 3.5
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general]
    timeout: 3.0
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    categories: [general, news]
    timeout: 3.0
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    categories: [general]
    timeout: 3.0
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: [general, science]
    timeout: 2.5
    disabled: false

  - name: wikidata
    engine: wikidata
    shortcut: wd
    categories: [general]
    timeout: 2.5
    disabled: false

  - name: reddit
    engine: reddit
    shortcut: rd
    categories: [general, it]
    timeout: 3.5
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    categories: [it]
    timeout: 3.0
    disabled: false

  - name: stackoverflow
    engine: stackoverflow
    shortcut: so
    categories: [it]
    timeout: 3.0
    disabled: false

  - name: arxiv
    engine: arxiv
    shortcut: arx
    categories: [science]
    timeout: 3.5
    disabled: false

  - name: pubmed
    engine: pubmed
    shortcut: pm
    categories: [science]
    timeout: 3.5
    disabled: false

  - name: bing news
    engine: bing_news
    shortcut: bn
    categories: [news]
    timeout: 3.0
    disabled: false

  - name: google news
    engine: google_news
